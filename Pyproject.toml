[project]
name = "fractals-project"
version = "0.1.0"
description = "Scientific project for fractal modeling using Python and Matplotlib"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=2.0.0"
]

[project.scripts]
fractals = "app.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.templates"]